<svg xmlns="http://www.w3.org/2000/svg" width="780" height="980" viewBox="0 0 780 980" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF4E9"/><stop offset="1" stop-color="#F1E3D0"/>
    </linearGradient>
    <linearGradient id="sky1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FC8F8"/><stop offset="1" stop-color="#D9F0FF"/>
    </linearGradient>
    <linearGradient id="sunset" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC46B"/><stop offset="1" stop-color="#FF9E7D"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#3A2E22" flood-opacity="0.16"/>
    </filter>
    <clipPath id="scr"><rect x="201" y="90" width="378" height="800" rx="45"/></clipPath>
    <clipPath id="photo1"><rect x="252" y="240" width="276" height="330" rx="16"/></clipPath>
  </defs>
  <rect width="780" height="980" fill="url(#bg)"/>
  <circle cx="110" cy="190" r="70" fill="#FFD9C2" opacity="0.45"/>
  <circle cx="690" cy="800" r="90" fill="#CDE8D6" opacity="0.45"/>

  <rect x="189" y="78" width="402" height="824" rx="56" fill="#16130F"/>
  <rect x="201" y="90" width="378" height="800" rx="45" fill="#FAF7F2"/>
  <g clip-path="url(#scr)">
    <!-- status bar -->
    <text x="238" y="120" font-size="15" font-weight="700" fill="#191816">9:41</text>
    <rect x="498" y="114" width="3.5" height="6" rx="1.5" fill="#191816"/>
    <rect x="504" y="111" width="3.5" height="9" rx="1.5" fill="#191816"/>
    <rect x="510" y="108" width="3.5" height="12" rx="1.5" fill="#191816"/>
    <rect x="516" y="105" width="3.5" height="15" rx="1.5" fill="#191816"/>
    <rect x="540" y="107" width="25" height="13" rx="4" fill="none" stroke="#191816" stroke-width="1.5"/>
    <rect x="542.5" y="109.5" width="15" height="8" rx="2" fill="#191816"/>

    <!-- title row -->
    <text x="233" y="164" font-size="26" font-weight="800" fill="#191816">留不留</text>
    <rect x="233" y="172" width="40" height="4" rx="2" fill="#FF6B35"/>
    <g stroke="#191816" stroke-width="2" fill="none" stroke-linecap="round">
      <path d="M532 150 h22"/><path d="M538 150 v-4 h10 v4"/>
      <rect x="534" y="150" width="18" height="22" rx="3"/>
      <path d="M540 156 v10 M548 156 v10"/>
    </g>
    <circle cx="559" cy="146" r="10" fill="#F5484D"/>
    <text x="559" y="150" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">12</text>

    <!-- progress -->
    <text x="233" y="196" font-size="13" fill="#8A8580">2024年5月 · 已看 128 / 356 张</text>
    <rect x="233" y="204" width="314" height="6" rx="3" fill="#EFE8DE"/>
    <rect x="233" y="204" width="113" height="6" rx="3" fill="#FF6B35"/>

    <!-- card stack: back -->
    <g transform="rotate(-7 390 428)">
      <rect x="240" y="212" width="300" height="400" rx="24" fill="#FFFFFF" stroke="#EDE6DC"/>
      <rect x="252" y="224" width="276" height="330" rx="16" fill="#E4EEF6"/>
    </g>
    <!-- mid -->
    <g transform="rotate(5 390 428)">
      <rect x="240" y="220" width="300" height="400" rx="24" fill="#FFFFFF" stroke="#EDE6DC"/>
      <rect x="252" y="232" width="276" height="330" rx="16" fill="url(#sunset)"/>
    </g>
    <!-- front -->
    <g>
      <rect x="240" y="228" width="300" height="400" rx="24" fill="#FFFFFF" filter="url(#soft)"/>
      <g clip-path="url(#photo1)">
        <rect x="252" y="240" width="276" height="330" fill="url(#sky1)"/>
        <circle cx="470" cy="300" r="30" fill="#FFD66B"/>
        <ellipse cx="330" cy="290" rx="26" ry="10" fill="#FFFFFF" opacity="0.9"/>
        <ellipse cx="352" cy="282" rx="18" ry="8" fill="#FFFFFF" opacity="0.9"/>
        <path d="M252 505 Q340 430 430 495 T528 465 V570 H252 Z" fill="#57A86B"/>
        <path d="M252 540 Q320 490 410 535 T528 520 V570 H252 Z" fill="#8CCB8E"/>
      </g>
      <text x="390" y="604" text-anchor="middle" font-size="12.5" fill="#8A8580">IMG_2048.jpg · 2.4 MB · 2024/05/12</text>
    </g>

    <!-- hints -->
    <text x="250" y="692" font-size="14" font-weight="600" fill="#F5484D">← 左滑删除</text>
    <text x="530" y="692" text-anchor="end" font-size="14" font-weight="600" fill="#2EBD6B">右滑保留 →</text>

    <!-- buttons -->
    <circle cx="300" cy="752" r="30" fill="#FFFFFF" stroke="#F5484D" stroke-width="2.5"/>
    <text x="300" y="761" text-anchor="middle" font-size="26" font-weight="700" fill="#F5484D">✕</text>
    <circle cx="390" cy="752" r="22" fill="#F0EAE2"/>
    <text x="390" y="760" text-anchor="middle" font-size="19" fill="#8A8580">↶</text>
    <circle cx="480" cy="752" r="30" fill="#FFFFFF" stroke="#2EBD6B" stroke-width="2.5"/>
    <text x="480" y="761" text-anchor="middle" font-size="26" font-weight="700" fill="#2EBD6B">✓</text>

    <rect x="331" y="868" width="118" height="5" rx="2.5" fill="#D8D1C7"/>
  </g>
  <circle cx="390" cy="112" r="7" fill="#16130F"/>
  <text x="390" y="948" text-anchor="middle" font-size="15" fill="#8A8580">01 · 滑卡清理主界面</text>
</svg>
